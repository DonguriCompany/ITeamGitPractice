<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>メンバー詳細</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <h1 id="title">メンバー詳細</h1>
  <div id="content">読み込み中...</div>
  <button class="back-button" onclick="history.back()">← 戻る</button>

  <script>
    function getUserFromQuery() {
      const params = new URLSearchParams(location.search);
      return params.get('user');
    }

    async function loadText(url) {
      const res = await fetch(url);
      if (!res.ok) return '読み込めませんでした';
      return await res.text();
    }

    async function renderUser(user) {
      document.getElementById('title').textContent = `${user} さんのページ`;

      const syumi = await loadText(`everyone/${user}/syumi.txt`);
      const nayami = await loadText(`everyone/${user}/nayami.txt`);
      const tokugi = await loadText(`everyone/${user}/tokugi.txt`);

      const content = document.getElementById('content');
      content.innerHTML = `
        <h3>趣味</h3>
        <pre>${syumi}</pre><br>
        <h3>悩み</h3>
        <pre>${nayami}</pre><br>
        <h3>特技</h3>
        <pre>${tokugi}</pre><br>
        <h3>一言</h3>
        <pre>${hitokoto}</pre>
      `;
    }

    const user = getUserFromQuery();
    if (user) {
      renderUser(user);
    } else {
      document.getElementById('content').textContent = 'ユーザーが指定されていません。';
    }
  </script>
</body>
</html>
