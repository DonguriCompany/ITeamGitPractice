<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITeamの遊び場</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <h1>ITeam Git Practiceへようこそ！</h1>
  <p>みんなで作り上げて行きましょう。</p>

  <h2>メンバー一覧</h2>
  <div id="userList">読み込み中...</div>

  <script>
    const users = ['hidaka', 'higuchi', 'kobashi','nakamura','oku','ryota','sato','shoji','suzuki'];
    const userList = document.getElementById('userList');
    userList.innerHTML = '';

    for (const user of users) {
      const button = document.createElement('button');
      button.textContent = `${user} さんのページへ`;
      button.onclick = () => {
        location.href = `detail.html?user=${user}`;
      };
      userList.appendChild(button);
    }
  </script>
</body>
</html>
